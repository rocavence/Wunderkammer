name: Wunderkammer
options:
  bundleIdPrefix: com.rocavence
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "8"
  configs:
    # 發佈版去掉除錯符號、刪掉沒用到的程式碼，app 小一點
    Release:
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      STRIP_SWIFT_SYMBOLS: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  Wunderkammer:
    build:
      targets:
        Wunderkammer: all
        WunderkammerTests: [test]
    test:
      language: zh-Hant
      targets:
        - WunderkammerTests
targets:
  Wunderkammer:
    type: application
    platform: macOS
    sources:
      - Wunderkammer
    # 簽章設定在 Config/Signing.xcconfig；本機憑證放 Signing.local.xcconfig（不進版控）
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocavence.wunderkammer
        # 對外叫 Wunder；模組名稱維持 Wunderkammer，測試與資料夾不受影響
        PRODUCT_NAME: Wunder
        PRODUCT_MODULE_NAME: Wunderkammer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wunder
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: ShareExtension
        embed: true
    # 讀取瀏覽器目前分頁的網址（⌘⇧C）需要 Apple Events；App Group 是分享延伸功能的收件匣
    entitlements:
      path: Wunderkammer/Wunderkammer.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups: [7F654HZB2H.com.rocavence.wunderkammer]
    info:
      path: Wunderkammer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: 按 ⌘⇧C 時，Wunder 會讀取瀏覽器目前分頁的網址與標題，把這個頁面收進展室。
        # wunderkammer://capture?url=…（書籤小程式、瀏覽器擴充）
        CFBundleURLTypes:
          - CFBundleURLName: com.rocavence.wunderkammer
            CFBundleURLSchemes: [wunderkammer]
        # 檔案拖到 Dock 上的 icon、「打開方式 → Wunderkammer」
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anything
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item]
        # 任何 app 的「服務」選單：選取文字、網址、檔案或圖片 →「收進 Wunderkammer」
        NSServices:
          - NSMessage: collectService
            NSPortName: Wunder
            NSMenuItem:
              default: 收進 Wunder
            NSRequiredContext: {}
            NSSendTypes: [public.utf8-plain-text, public.url, public.file-url, public.png, public.tiff, public.rtf]
            NSSendFileTypes: [public.item]
  # 「分享」選單 → Wunderkammer：放進 App Group 收件匣後立刻關閉，由 app 收進來
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [7F654HZB2H.com.rocavence.wunderkammer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocavence.wunderkammer.share
        # NSItemProvider 還沒有 Swift 6 的並行標註
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wunder
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsText: true
  WunderkammerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WunderkammerTests
    dependencies:
      - target: Wunderkammer
    # 測試 bundle 要和 app 同一個簽章身分，否則 hardened runtime 不讓它載入
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wunder.app/Contents/MacOS/Wunder
