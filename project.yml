name: Wunderkammer
options:
  bundleIdPrefix: com.rocavence
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  Wunderkammer:
    build:
      targets:
        Wunderkammer: all
        WunderkammerTests: [test]
    test:
      targets:
        - WunderkammerTests
targets:
  Wunderkammer:
    type: application
    platform: macOS
    sources:
      - Wunderkammer
    # 簽章設定在 Config/Signing.xcconfig；本機憑證放 Signing.local.xcconfig（不進版控）
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocavence.wunderkammer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wunderkammer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    # 讀取瀏覽器目前分頁的網址（⌘⇧C）需要 Apple Events
    entitlements:
      path: Wunderkammer/Wunderkammer.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: Wunderkammer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: 按 ⌘⇧C 時，Wunderkammer 會讀取瀏覽器目前分頁的網址與標題，把這個頁面收進珍奇室。
        # wunderkammer://capture?url=…（書籤小程式、瀏覽器擴充）
        CFBundleURLTypes:
          - CFBundleURLName: com.rocavence.wunderkammer
            CFBundleURLSchemes: [wunderkammer]
        # 任何 app 的「服務」選單：選取文字、網址、檔案或圖片 →「收進 Wunderkammer」
        NSServices:
          - NSMessage: collectService
            NSPortName: Wunderkammer
            NSMenuItem:
              default: 收進 Wunderkammer
            NSRequiredContext: {}
            NSSendTypes: [public.utf8-plain-text, public.url, public.file-url, public.png, public.tiff, public.rtf]
            NSSendFileTypes: [public.item]
  WunderkammerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WunderkammerTests
    dependencies:
      - target: Wunderkammer
    # 測試 bundle 要和 app 同一個簽章身分，否則 hardened runtime 不讓它載入
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wunderkammer.app/Contents/MacOS/Wunderkammer
